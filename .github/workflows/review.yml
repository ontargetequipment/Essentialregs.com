name: Review pending summaries

# Automated AI second-pass review (pipeline/review.py). Selects rows whose
# summary is still 'pending', checks each against the official text (assembled
# exactly as the summarizer assembles it), and with `execute` writes the
# verdict: pass -> approved, corrected -> approved with the corrected text and
# the prior text kept in summary_original, fail -> left pending and listed in
# the report. Without `execute` it is a dry run: no paid call, no write, a cost
# quote per model option. `rereview` selects the hand-approved rows instead
# (snapshot first; fail -> pending). See pipeline/README.md, "Automated AI
# review pass". Since 6 Oct 2026 (ReviewBuiltIn) the review also runs
# automatically inside the Generate summaries and Import workflows for the
# rows they write; this workflow is for re-reviews, audits and redo runs.

on:
  workflow_dispatch:
    inputs:
      reg:
        description: "Regulation(s) to review: one id prefix (7, 3, 26, gp12, oooob) or a comma-separated list (gp01,gp02,...), taken in that order. Leave blank for every pending row."
        required: false
        default: ""
      ids:
        description: "Comma-separated exact provision ids (only pending ones are reviewed). Leave blank for reg/limit selection."
        required: false
        default: ""
      limit:
        description: "Stop after this many rows (for pilots). Leave blank for no limit."
        required: false
        default: ""
      model:
        description: "Reviewer model id (separate call from the summarizer; see pipeline/README.md for the options and their batch prices)."
        required: false
        default: "claude-sonnet-5-5"
      effort:
        description: "Thinking effort for 5.x models (ignored for temperature models such as claude-sonnet-4-5)."
        type: choice
        options: [low, medium, high]
        default: low
      max_cost:
        description: "Cap on the WHOLE run in USD: refuse to submit above this estimate; cancel the remaining batches once actual spend passes it. Leave blank for no run cap. The standing budget ($10 per regulation per run, pipeline/budget.py) applies as well, always."
        required: false
        default: ""
      approved_budget:
        description: "Owner-approved budget in USD per regulation for THIS run, replacing the standing $10 rule. Printed at the top of the report. Leave blank for the standing rule."
        required: false
        default: ""
      audit_population:
        description: "Audit mode: which approved rows to sample -- hand (reviewed_by without 'automated pipeline', the original audit), pipeline (AI-reviewed rows, what the monthly audit uses), all."
        type: choice
        options: [hand, pipeline, all]
        default: hand
      audit_sample:
        description: "AUDIT MODE: review N random approved rows (reviewed_by not containing 'automated pipeline', spread across regulations) and write NOTHING to the database, only the report. Leave blank for the normal pending-row review."
        required: false
        default: ""
      seed:
        description: "Audit mode: random seed for the sample (same seed, same sample)."
        required: false
        default: "20261005"
      audit_ids:
        description: "AUDIT MODE on exact ids: comma-separated approved/edited provision ids to re-check read-only (nothing written; report only). Overrides audit_sample/seed/ids/limit/reg."
        required: false
        default: ""
      from_snapshot:
        description: "With audit_ids: review the BEFORE summary from archive.summary_review_snapshot_rereview instead of the live one (read-only)."
        type: boolean
        required: false
        default: false
      redo_corrections_since:
        description: "REDO MODE: timestamp (e.g. 2026-10-05T04:38:00Z). Every snapshotted row the pipeline corrected at or after it has its BEFORE summary reviewed again with the full ancestor context; pass restores the before text, corrected writes the new text, fail sets pending. Not combinable with rereview/audit_sample."
        required: false
        default: ""
      redo_until:
        description: "With redo_corrections_since: only corrections made before this timestamp (resume a redo without re-selecting the rows it already re-corrected)."
        required: false
        default: ""
      resume_batch:
        description: "Resume: comma-separated Anthropic batch ids a previous run submitted but did not finish writing (from its log). Consumes their results and writes the verdicts for the rows still in scope; submits NOTHING new and pays nothing new. Combine with the same selection inputs as the original run (e.g. rereview)."
        required: false
        default: ""
      rereview:
        description: "RE-REVIEW MODE: select approved/edited rows whose reviewed_by does not contain 'automated pipeline' (the September hand passes) instead of pending rows. With execute: every selected row is snapshotted to archive first; pass stamps reviewed_by/reviewed_at, corrected writes as usual, fail sets the row back to pending with its text unchanged. reg/ids/limit apply. Not combinable with audit_sample."
        type: boolean
        required: false
        default: false
      execute:
        description: "Execute: make the paid calls and write the verdicts (audit mode: make the paid calls, write nothing). Leave unchecked for a dry run (no paid calls, no writes, cost quote only)."
        type: boolean
        required: false
        default: false

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 360 # batches can queue for a while; same ceiling as the summarizer
    defaults:
      run:
        working-directory: pipeline
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt pytest==9.1.1

      - name: Unit tests
        run: python -m pytest test_review.py -q

      - name: Run review
        env:
          # The API key is passed to dry runs too: review.py only uses it there
          # for messages.count_tokens, a free endpoint, so the quote is exact.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          ARGS=()
          if [ -n "${{ inputs.reg }}" ]; then ARGS+=(--reg "${{ inputs.reg }}"); fi
          if [ -n "${{ inputs.ids }}" ]; then ARGS+=(--ids "${{ inputs.ids }}"); fi
          if [ -n "${{ inputs.limit }}" ]; then ARGS+=(--limit "${{ inputs.limit }}"); fi
          if [ -n "${{ inputs.max_cost }}" ]; then ARGS+=(--max-cost "${{ inputs.max_cost }}"); fi
          if [ -n "${{ inputs.audit_sample }}" ]; then ARGS+=(--audit "${{ inputs.audit_sample }}" --seed "${{ inputs.seed }}" --audit-population "${{ inputs.audit_population }}"); fi
          if [ -n "${{ inputs.approved_budget }}" ]; then ARGS+=(--approved-budget "${{ inputs.approved_budget }}"); fi
          if [ -n "${{ inputs.audit_ids }}" ]; then ARGS+=(--audit-ids "${{ inputs.audit_ids }}"); fi
          if [ "${{ inputs.from_snapshot }}" = "true" ]; then ARGS+=(--from-snapshot); fi
          if [ -n "${{ inputs.redo_corrections_since }}" ]; then ARGS+=(--redo-corrections-since "${{ inputs.redo_corrections_since }}"); fi
          if [ -n "${{ inputs.redo_until }}" ]; then ARGS+=(--redo-until "${{ inputs.redo_until }}"); fi
          if [ "${{ inputs.rereview }}" = "true" ]; then ARGS+=(--rereview); fi
          if [ -n "${{ inputs.resume_batch }}" ]; then ARGS+=(--resume-batch "${{ inputs.resume_batch }}"); fi
          if [ "${{ inputs.execute }}" = "true" ]; then ARGS+=(--execute); else ARGS+=(--dry-run); fi
          ARGS+=(--model "${{ inputs.model }}" --effort "${{ inputs.effort }}")
          echo "Running: python review.py ${ARGS[*]}"
          python review.py "${ARGS[@]}"

      - name: Report to the job summary and the job log
        # The log copy is what a reviewer without artifact access reads (the
        # artifact store is an Azure blob host some networks deny): every
        # corrected row with before / after / reasons and every failed row
        # with its reason, straight from the same report.
        if: always()
        run: |
          if [ -f out/review_report.md ]; then
            head -c 60000 out/review_report.md >> "$GITHUB_STEP_SUMMARY"
            echo "::group::review_report.md"
            cat out/review_report.md
            echo "::endgroup::"
          else
            echo "No report written (an earlier step failed)." >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f review_failed.jsonl ]; then
            echo "::group::review_failed.jsonl"
            cat review_failed.jsonl
            echo "::endgroup::"
          fi

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: review-report
          path: |
            pipeline/out/review_report.md
            pipeline/out/review_report.json
            pipeline/review_failed.jsonl
          retention-days: 90
          if-no-files-found: warn

      - name: Run summary (printed last, so it survives log truncation)
        # The full report above can be longer than the GitHub API returns for
        # a job log; the API keeps the end. This compact summary (counts,
        # actual cost, by regulation, failed rows) is the last thing printed.
        if: always()
        run: python review_summary.py out/review_report.json
