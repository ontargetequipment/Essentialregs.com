name: Import regulation from official PDF

on:
  workflow_dispatch:
    inputs:
      reg:
        description: "Regulation number to (re-)import, e.g. 7, 3, 22, 26, cp, aqs, sip, proc, ecmc, oooob, ooooa, ooooc, gp01-gp12, jjjj, iiii, zzzz, p190, p191, p192, p193, p194, p195, p196, p199."
        required: true
      execute:
        description: "Execute: actually write the plan to Supabase. Leave unchecked to only parse/export/diff/build the apply plan and upload the report -- no database writes."
        type: boolean
        required: false
        default: false
      skip_summaries:
        description: "EMERGENCY opt-out: do NOT run the chained summarize -> review -> embed run after the import. Normally every row whose letters or digits changed (and its ancestors) is regenerated, reviewed and embedded in this same run, within the standing $10 per regulation budget. Leave unchecked."
        type: boolean
        required: false
        default: false
      approved_budget:
        description: "Owner-approved budget in USD per regulation for this run's summaries, replacing the standing $10 rule. Leave blank for the standing rule."
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 360   # the chained run polls the Batches API, like the summarize workflow
    env:
      REG: ${{ inputs.reg }}
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Validate reg input
        run: |
          if [[ ! "$REG" =~ ^[A-Za-z0-9]+$ ]]; then
            echo "::error::reg must be alphanumeric (e.g. 7, 3, 26, oooob, ooooa, ooooc) -- got: $REG"
            exit 1
          fi

      - name: Map reg to source file basename
        run: |
          # Numeric CCR regs (3, 7, 22, 26, ...) use pipeline/sources/REG_<n>.pdf/.txt,
          # which covers Batch 7's 4/10/15/23/28/29/31 with no change here.
          # The three name-keyed AQCC documents have their own basenames:
          # cp -> REG_CP, aqs -> REG_AQS, sip -> REG_SIP and (Batch 7) the
          # Procedural Rules, proc -> REG_PROC.
          # Federal eCFR subparts use their own subpart-code basename instead --
          # oooob -> OOOOb.pdf/.txt, ooooa -> OOOOa.pdf/.txt, ooooc -> OOOOc.pdf/.txt,
          # jjjj -> JJJJ.pdf/.txt, iiii -> IIII.pdf/.txt, zzzz -> ZZZZ.pdf/.txt.
          # APCD general permits (gp01-gp12) use their upper-cased key as the
          # basename -- gp01 -> GP01.pdf/.txt, ..., gp12 -> GP12.pdf/.txt.
          # 49 CFR Parts 191/192 (PHMSA) are whole-PART eCFR imports, read
          # directly from pipeline/sources/P19x.xml -- p191 -> P191,
          # p192 -> P192, p194 -> P194, p195 -> P195, p199 -> P199 (Batch B),
          # p190 -> P190, p193 -> P193, p196 -> P196 (Batch C). No PDF/TXT is
          # required for these (see
          # the pdftotext step below).
          if [[ "$REG" =~ ^[0-9]+$ ]]; then
            SRC_BASENAME="REG_${REG}"
          elif [ "$REG" = "cp" ]; then
            SRC_BASENAME="REG_CP"
          elif [ "$REG" = "aqs" ]; then
            SRC_BASENAME="REG_AQS"
          elif [ "$REG" = "sip" ]; then
            SRC_BASENAME="REG_SIP"
          elif [ "$REG" = "proc" ]; then
            SRC_BASENAME="REG_PROC"
          elif [ "$REG" = "ecmc" ]; then
            SRC_BASENAME="ECMC"
          elif [ "$REG" = "oooob" ]; then
            SRC_BASENAME="OOOOb"
          elif [ "$REG" = "ooooa" ]; then
            SRC_BASENAME="OOOOa"
          elif [ "$REG" = "ooooc" ]; then
            SRC_BASENAME="OOOOc"
          elif [[ "$REG" =~ ^gp[0-9]{2}$ ]]; then
            SRC_BASENAME="${REG^^}"
          elif [[ "$REG" =~ ^(jjjj|iiii|zzzz)$ ]]; then
            SRC_BASENAME="${REG^^}"
          elif [[ "$REG" =~ ^p19[0-9]$ ]]; then
            SRC_BASENAME="${REG^^}"
          else
            echo "::error::Don't know the source file basename for reg '$REG' -- expected a numeric CCR reg (e.g. 7, 22, 26), cp, aqs, sip, proc, ecmc, one of oooob/ooooa/ooooc/jjjj/iiii/zzzz, an APCD general permit gp01-gp12, or one of the whole-PART 49 CFR regs p190/p191/p192/p193/p194/p195/p196/p199."
            exit 1
          fi
          echo "SRC_BASENAME=${SRC_BASENAME}" >> "$GITHUB_ENV"
          echo "Resolved reg '$REG' -> source basename '${SRC_BASENAME}'."

      - name: Install poppler-utils (pdftotext)
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r pipeline/requirements.txt

      - name: pdftotext (skip if the .txt is already committed)
        run: |
          # p19x (190/191/192/193/194/195/196/199) are whole-PART eCFR imports parsed directly from the
          # eCFR versioner XML (import_ecfr.py's parse_ecfr_part()) -- they
          # need neither a PDF nor a pdftotext .txt to exist, only the XML.
          # This is the "sources present" sanity check for these two: it
          # fails the job early, with a clear message, instead of letting
          # a missing XML surface later as an obscure parse error.
          if [[ "$REG" =~ ^p19[0-9]$ ]]; then
            XML="pipeline/sources/${SRC_BASENAME}.xml"
            if [ ! -f "$XML" ]; then
              echo "::error::$XML not found. The whole-PART 49 CFR regs (p190/p191/p192/p193/p194/p195/p196/p199) are parsed directly from the eCFR versioner XML; commit it to pipeline/sources/ first."
              exit 1
            fi
            echo "$XML present -- p19x whole-PART regs read the eCFR XML directly, no PDF/TXT needed. Skipping pdftotext."
          else
            PDF="pipeline/sources/${SRC_BASENAME}.pdf"
            TXT="pipeline/sources/${SRC_BASENAME}.txt"
            if [ -f "$TXT" ]; then
              echo "$TXT already exists in the repo -- skipping pdftotext."
            elif [ -f "$PDF" ]; then
              pdftotext -layout "$PDF" "$TXT"
              echo "Generated $TXT from $PDF."
            else
              echo "::error::Neither $TXT nor $PDF found. Commit the official PDF to pipeline/sources/ first."
              exit 1
            fi
          fi

      - name: Dump the live corpus id index (for cross-regulation deep links)
        # Read-only. Writes pipeline/out/corpus_ids.json, which `parse` below
        # picks up by default so a citation of another regulation ("Regulation
        # Number 7, Part B, Section I.B.33") links to the exact cited provision
        # in the LIVE corpus rather than to a possibly stale committed copy,
        # and pipeline/out/corpus_definitions.json (every definition row's
        # defined term), which `parse` uses to verify a deep link into a
        # definition against the term the citing sentence names -- a permit
        # written against an older Regulation 7 must not open the wrong
        # definition (renumbered -> the sibling that defines it; unverifiable
        # -> plain text). Both default paths; the committed copies are the
        # fallback when this step is skipped.
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python pipeline/import_ccr.py dump-ids --out pipeline/out/corpus_ids.json

      - name: Parse PDF into provisions JSON
        run: |
          python pipeline/import_ccr.py parse \
            --reg "$REG" \
            --pdf "pipeline/sources/${SRC_BASENAME}.pdf" \
            --txt "pipeline/sources/${SRC_BASENAME}.txt" \
            --out "pipeline/out/reg${REG}_parsed.json"

      - name: Export current DB rows for this regulation
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python pipeline/import_ccr.py export \
            --reg "$REG" \
            --out "pipeline/out/reg${REG}_db.json"

      - name: Diff parsed output against the DB export
        run: |
          python pipeline/import_ccr.py diff \
            --reg "$REG" \
            --parsed "pipeline/out/reg${REG}_parsed.json" \
            --db "pipeline/out/reg${REG}_db.json" \
            --out "pipeline/out/reg${REG}_diff_report.md"

      - name: Build apply plan (and execute it, if requested)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          ARGS=(apply --reg "$REG" \
            --parsed "pipeline/out/reg${REG}_parsed.json" \
            --db "pipeline/out/reg${REG}_db.json" \
            --out-dir "pipeline/out/apply_reg${REG}")
          if [ "${{ inputs.execute }}" = "true" ]; then
            ARGS+=(--execute --yes)
          fi
          echo "Running: python pipeline/import_ccr.py ${ARGS[*]}"
          python pipeline/import_ccr.py "${ARGS[@]}"

      - name: Print stats and diff report to the job log
        if: always()
        run: |
          echo "### apply_reg${REG}/stats.md"
          cat "pipeline/out/apply_reg${REG}/stats.md" || echo "(not found -- an earlier step must have failed)"
          echo
          echo "### reg${REG}_diff_report.md (first 60 lines)"
          head -n 60 "pipeline/out/reg${REG}_diff_report.md" || echo "(not found -- an earlier step must have failed)"

      - name: Summarize, review and embed the rows this import changed (the chained run)
        # Runs automatically after every execute (ReviewBuiltIn, owner
        # decision 5 Oct 2026): every row whose letters or digits changed,
        # plus its ancestors, is regenerated, reviewed and embedded here, in
        # this run, within the standing $10 per regulation budget
        # (pipeline/budget.py). Both inputs are `type: boolean`, so in the
        # `inputs` context they are real booleans (never compare them to the
        # string 'true' here).
        if: ${{ inputs.execute && !inputs.skip_summaries }}
        id: chain
        working-directory: pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CHAIN_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          ARGS=(--ids-file "out/apply_reg${REG}/summary_regen_ids.txt"
                --ancestor-ids-file "out/apply_reg${REG}/summary_regen_ancestor_ids.txt"
                --label "import-reg${REG}" --sample-dir "../docs/imports/$(date -u +%Y-%m-%d)")
          if [ -n "${{ inputs.approved_budget }}" ]; then ARGS+=(--approved-budget "${{ inputs.approved_budget }}"); fi
          echo "Running: python run_chain.py ${ARGS[*]}"
          python run_chain.py "${ARGS[@]}"
          if [ -f out/chain_report.md ]; then
            head -c 60000 out/chain_report.md >> "$GITHUB_STEP_SUMMARY"
            echo "::group::chain_report.md"; cat out/chain_report.md; echo "::endgroup::"
          fi

      - name: Embed every other changed row (heading-only rows, markup-only changes)
        # The chained run embeds the rows it wrote. Rows whose text changed
        # but that carry no summary (headings-only) are embedded here; the
        # content hash means unchanged rows cost nothing.
        if: ${{ inputs.execute }}
        working-directory: pipeline
        env:
          VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python embed.py --reg "$REG"

      - name: Open a pull request with the spot-check sample
        if: ${{ inputs.execute && !inputs.skip_summaries && steps.chain.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git add docs/imports
          if git diff --cached --quiet; then echo "No sample document to commit."; exit 0; fi
          BRANCH="chain-sample/import-reg${REG}-${{ github.run_id }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git commit -m "Import reg ${REG}: 40-row spot-check sample from the chained run (run ${{ github.run_id }})"
          git push -u origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" \
            --title "Import reg ${REG}: spot-check sample (run ${{ github.run_id }})" \
            --body "The 40-row spot-check sample from the chained run that followed the import of reg ${REG}: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}." \
            || echo "::warning::Could not open the pull request. The sample is in the import artifact and on branch $BRANCH."

      - name: Upload import report (no SQL batch files)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: import-reg${{ inputs.reg }}
          path: |
            pipeline/out/**
            !pipeline/out/**/*.sql
          retention-days: 30
          if-no-files-found: warn
