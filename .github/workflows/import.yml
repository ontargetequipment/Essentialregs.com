name: Import regulation from official PDF

on:
  workflow_dispatch:
    inputs:
      reg:
        description: "Regulation number to (re-)import, e.g. 7, 3, 22, 26, cp, aqs, sip, proc, ecmc, oooo, oooob, ooooa, ooooc, gp01-gp12, jjjj, iiii, zzzz, p190, p191, p192, p193, p194, p195, p196, p199."
        required: true
      execute:
        description: "Execute: actually write the plan to Supabase. Leave unchecked to only parse/export/diff/build the apply plan and upload the report -- no database writes."
        type: boolean
        required: false
        default: false
      skip_summaries:
        description: "EMERGENCY opt-out: do NOT run the chained summarize -> review -> embed run after the import. Normally every row whose letters or digits changed (and its ancestors) is regenerated, reviewed and embedded in this same run, within the standing $10 per regulation budget. Leave unchecked."
        type: boolean
        required: false
        default: false
      approved_budget:
        description: "Owner-approved budget in USD per regulation for this run's summaries, replacing the standing $10 rule. Leave blank for the standing rule."
        required: false
        default: ""
      ecfr_pdf_url:
        description: "First import of a 40 CFR subpart only: the eCFR Print/PDF link to download when pipeline/sources/<CODE>.pdf is not committed yet (the page's own link and the known URL shapes are tried when blank). The fetched PDF and its pdftotext text are committed to this branch."
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 360   # the chained run polls the Batches API, like the summarize workflow
    env:
      REG: ${{ inputs.reg }}
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Validate reg input
        run: |
          if [[ ! "$REG" =~ ^[A-Za-z0-9]+$ ]]; then
            echo "::error::reg must be alphanumeric (e.g. 7, 3, 26, oooob, ooooa, ooooc) -- got: $REG"
            exit 1
          fi

      - name: Map reg to source file basename
        run: |
          # Numeric CCR regs (3, 7, 22, 26, ...) use pipeline/sources/REG_<n>.pdf/.txt,
          # which covers Batch 7's 4/10/15/23/28/29/31 with no change here.
          # The three name-keyed AQCC documents have their own basenames:
          # cp -> REG_CP, aqs -> REG_AQS, sip -> REG_SIP and (Batch 7) the
          # Procedural Rules, proc -> REG_PROC.
          # Federal eCFR subparts use their own subpart-code basename instead --
          # oooo -> OOOO.pdf/.txt (the original Subpart OOOO, 8 Oct 2026),
          # oooob -> OOOOb.pdf/.txt, ooooa -> OOOOa.pdf/.txt, ooooc -> OOOOc.pdf/.txt,
          # jjjj -> JJJJ.pdf/.txt, iiii -> IIII.pdf/.txt, zzzz -> ZZZZ.pdf/.txt.
          # APCD general permits (gp01-gp12) use their upper-cased key as the
          # basename -- gp01 -> GP01.pdf/.txt, ..., gp12 -> GP12.pdf/.txt.
          # 49 CFR Parts 191/192 (PHMSA) are whole-PART eCFR imports, read
          # directly from pipeline/sources/P19x.xml -- p191 -> P191,
          # p192 -> P192, p194 -> P194, p195 -> P195, p199 -> P199 (Batch B),
          # p190 -> P190, p193 -> P193, p196 -> P196 (Batch C). No PDF/TXT is
          # required for these (see
          # the pdftotext step below).
          if [[ "$REG" =~ ^[0-9]+$ ]]; then
            SRC_BASENAME="REG_${REG}"
          elif [ "$REG" = "cp" ]; then
            SRC_BASENAME="REG_CP"
          elif [ "$REG" = "aqs" ]; then
            SRC_BASENAME="REG_AQS"
          elif [ "$REG" = "sip" ]; then
            SRC_BASENAME="REG_SIP"
          elif [ "$REG" = "proc" ]; then
            SRC_BASENAME="REG_PROC"
          elif [ "$REG" = "ecmc" ]; then
            SRC_BASENAME="ECMC"
          elif [ "$REG" = "oooo" ]; then
            SRC_BASENAME="OOOO"
          elif [ "$REG" = "oooob" ]; then
            SRC_BASENAME="OOOOb"
          elif [ "$REG" = "ooooa" ]; then
            SRC_BASENAME="OOOOa"
          elif [ "$REG" = "ooooc" ]; then
            SRC_BASENAME="OOOOc"
          elif [[ "$REG" =~ ^gp[0-9]{2}$ ]]; then
            SRC_BASENAME="${REG^^}"
          elif [[ "$REG" =~ ^(jjjj|iiii|zzzz)$ ]]; then
            SRC_BASENAME="${REG^^}"
          elif [[ "$REG" =~ ^p19[0-9]$ ]]; then
            SRC_BASENAME="${REG^^}"
          else
            echo "::error::Don't know the source file basename for reg '$REG' -- expected a numeric CCR reg (e.g. 7, 22, 26), cp, aqs, sip, proc, ecmc, one of oooo/oooob/ooooa/ooooc/jjjj/iiii/zzzz, an APCD general permit gp01-gp12, or one of the whole-PART 49 CFR regs p190/p191/p192/p193/p194/p195/p196/p199."
            exit 1
          fi
          echo "SRC_BASENAME=${SRC_BASENAME}" >> "$GITHUB_ENV"
          echo "Resolved reg '$REG' -> source basename '${SRC_BASENAME}'."

      - name: Install poppler-utils (pdftotext)
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Fetch the eCFR print when a 40 CFR subpart's source is not committed yet
        # First import of a federal subpart (8 Oct 2026, Subpart OOOO). The
        # importer parses the eCFR "enhanced display" print -- the PDF a
        # person saves from the eCFR's Print/PDF menu -- and the checklist
        # says to commit it to pipeline/sources/ first. www.ecfr.gov is not
        # reachable from a Claude Code cloud session (the egress proxy
        # refuses the host), so when neither the PDF nor the text is
        # committed for one of the 40 CFR subpart keys, this step downloads
        # the print here, on the runner, which reaches it (the freshness
        # watcher has fetched the versioner API from runners since
        # September 2026). A candidate is accepted only when the download is
        # a PDF whose first text line is the eCFR running header of this
        # subpart. The "Commit fetched sources" step below saves the PDF and
        # its pdftotext text to this branch, so the dry run and the execute
        # run read the same bytes and the file is in the repository like
        # every other source. Never runs when the source is committed.
        if: ${{ contains(fromJSON('["oooo","ooooa","oooob","ooooc","jjjj","iiii","zzzz"]'), inputs.reg) }}
        id: fetch_ecfr
        env:
          ECFR_PDF_URL: ${{ inputs.ecfr_pdf_url }}
          UA: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36 EssentialRegsImporter/1.0 (+https://essentialregs.com)"
        run: |
          set -o pipefail
          PDF="pipeline/sources/${SRC_BASENAME}.pdf"
          TXT="pipeline/sources/${SRC_BASENAME}.txt"
          if [ -f "$PDF" ] || [ -f "$TXT" ]; then
            echo "$SRC_BASENAME source is committed -- nothing to fetch."
            echo "fetched=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CODE="$SRC_BASENAME"
          PART=60; [ "$REG" = "zzzz" ] && PART=63
          mkdir -p pipeline/out/ecfr_fetch
          PAGE_URL="https://www.ecfr.gov/current/title-40/part-${PART}/subpart-${CODE}"
          echo "Subpart page: $PAGE_URL"
          curl -sSL -A "$UA" -o pipeline/out/ecfr_fetch/page.html -w "page HTTP %{http_code}, final URL %{url_effective}\n" "$PAGE_URL"
          grep -o -i '[^"'"'"' <>]*\(pdf\|print\)[^"'"'"' <>]*' pipeline/out/ecfr_fetch/page.html | sort -u > pipeline/out/ecfr_fetch/pdf_mentions.txt || true
          echo "::group::PDF / print mentions in the page HTML"; cat pipeline/out/ecfr_fetch/pdf_mentions.txt; echo "::endgroup::"
          VERS_URL="https://www.ecfr.gov/api/versioner/v1/versions/title-40.json?part=${PART}&subpart=${CODE}"
          curl -sSL -A "$UA" -o pipeline/out/ecfr_fetch/versions.json -w "versions HTTP %{http_code}\n" "$VERS_URL" || true
          if jq -e '.content_versions' pipeline/out/ecfr_fetch/versions.json >/dev/null 2>&1; then
            echo "Versioner: $(jq '.content_versions | length' pipeline/out/ecfr_fetch/versions.json) section versions; latest amendment date $(jq -r '[.content_versions[].amendment_date] | max' pipeline/out/ecfr_fetch/versions.json); latest issue date $(jq -r '[.content_versions[].issue_date] | max' pipeline/out/ecfr_fetch/versions.json)"
          fi
          cands=()
          [ -n "$ECFR_PDF_URL" ] && cands+=("$ECFR_PDF_URL")
          while read -r u; do
            [ -z "$u" ] && continue
            case "$u" in
              http*) cands+=("$u") ;;
              /*) cands+=("https://www.ecfr.gov$u") ;;
            esac
          done < <(grep -i 'pdf' pipeline/out/ecfr_fetch/pdf_mentions.txt || true)
          cands+=(
            "https://www.ecfr.gov/api/renderer/v1/content/enhanced/current/title-40.pdf?part=${PART}&subpart=${CODE}"
            "https://www.ecfr.gov/api/renderer/v1/content/pdf/current/title-40?part=${PART}&subpart=${CODE}"
            "https://www.ecfr.gov/current/title-40/part-${PART}/subpart-${CODE}.pdf"
            "https://www.ecfr.gov/current/title-40/part-${PART}/subpart-${CODE}?print=pdf"
            "https://www.ecfr.gov/api/renderer/v1/content/enhanced/current/title-40?part=${PART}&subpart=${CODE}&format=pdf"
          )
          found=""
          for u in "${cands[@]}"; do
            echo "--- candidate: $u"
            if ! curl -sSL -A "$UA" --max-time 600 -o pipeline/out/ecfr_fetch/cand.bin -w "HTTP %{http_code}, %{size_download} bytes, %{content_type}\n" "$u"; then
              echo "download failed"; continue
            fi
            mime=$(file -b --mime-type pipeline/out/ecfr_fetch/cand.bin)
            echo "mime: $mime"
            [ "$mime" = "application/pdf" ] || continue
            pdftotext -layout pipeline/out/ecfr_fetch/cand.bin pipeline/out/ecfr_fetch/cand.txt
            first=$(grep -m1 -v '^\s*$' pipeline/out/ecfr_fetch/cand.txt || true)
            echo "first text line: $first"
            if echo "$first" | grep -q "Part ${PART} Subpart ${CODE} (up to date as of"; then found="$u"; break; fi
            echo "not the enhanced-display print of Subpart ${CODE}; next"
          done
          if [ -z "$found" ]; then
            echo "::error::No candidate URL returned the enhanced-display PDF of Subpart ${CODE}. Read pdf_mentions.txt in the import artifact for the page's own link and re-run with ecfr_pdf_url set."
            exit 1
          fi
          cp pipeline/out/ecfr_fetch/cand.bin "$PDF"
          # The same command the pdftotext step below would run; written here so the
          # commit step saves both files together.
          pdftotext -layout "$PDF" "$TXT"
          echo "$found" > pipeline/out/ecfr_fetch/pdf_source_url.txt
          echo "fetched=true" >> "$GITHUB_OUTPUT"
          echo "pdf_source_url=$found" >> "$GITHUB_OUTPUT"
          echo "PDF source URL: $found"
          echo "Header: $(grep -m1 -v '^\s*$' "$TXT")"
          echo "$(grep -c $'\f' "$TXT" || true) pages; $(wc -c < "$PDF") bytes PDF; $(wc -l < "$TXT") text lines"
          sha256sum "$PDF" "$TXT" | tee pipeline/out/ecfr_fetch/sha256.txt
          rm -f pipeline/out/ecfr_fetch/cand.bin pipeline/out/ecfr_fetch/cand.txt

      - name: Commit fetched sources to this branch
        if: ${{ steps.fetch_ecfr.outputs.fetched == 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "pipeline/sources/${SRC_BASENAME}.pdf" "pipeline/sources/${SRC_BASENAME}.txt"
          FIRST=$(grep -m1 -v '^\s*$' "pipeline/sources/${SRC_BASENAME}.txt")
          git commit -m "Sources: eCFR print of 40 CFR Subpart ${SRC_BASENAME} (${SRC_BASENAME}.pdf/.txt)" \
                     -m "Downloaded by the Import regulation workflow (run ${{ github.run_id }}) from ${{ steps.fetch_ecfr.outputs.pdf_source_url }}. Header: ${FIRST}"
          git push origin "HEAD:${{ github.ref_name }}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r pipeline/requirements.txt

      - name: pdftotext (skip if the .txt is already committed)
        run: |
          # p19x (190/191/192/193/194/195/196/199) are whole-PART eCFR imports parsed directly from the
          # eCFR versioner XML (import_ecfr.py's parse_ecfr_part()) -- they
          # need neither a PDF nor a pdftotext .txt to exist, only the XML.
          # This is the "sources present" sanity check for these two: it
          # fails the job early, with a clear message, instead of letting
          # a missing XML surface later as an obscure parse error.
          if [[ "$REG" =~ ^p19[0-9]$ ]]; then
            XML="pipeline/sources/${SRC_BASENAME}.xml"
            if [ ! -f "$XML" ]; then
              echo "::error::$XML not found. The whole-PART 49 CFR regs (p190/p191/p192/p193/p194/p195/p196/p199) are parsed directly from the eCFR versioner XML; commit it to pipeline/sources/ first."
              exit 1
            fi
            echo "$XML present -- p19x whole-PART regs read the eCFR XML directly, no PDF/TXT needed. Skipping pdftotext."
          else
            PDF="pipeline/sources/${SRC_BASENAME}.pdf"
            TXT="pipeline/sources/${SRC_BASENAME}.txt"
            if [ -f "$TXT" ]; then
              echo "$TXT already exists in the repo -- skipping pdftotext."
            elif [ -f "$PDF" ]; then
              pdftotext -layout "$PDF" "$TXT"
              echo "Generated $TXT from $PDF."
            else
              echo "::error::Neither $TXT nor $PDF found. Commit the official PDF to pipeline/sources/ first."
              exit 1
            fi
          fi

      - name: Dump the live corpus id index (for cross-regulation deep links)
        # Read-only. Writes pipeline/out/corpus_ids.json, which `parse` below
        # picks up by default so a citation of another regulation ("Regulation
        # Number 7, Part B, Section I.B.33") links to the exact cited provision
        # in the LIVE corpus rather than to a possibly stale committed copy,
        # and pipeline/out/corpus_definitions.json (every definition row's
        # defined term), which `parse` uses to verify a deep link into a
        # definition against the term the citing sentence names -- a permit
        # written against an older Regulation 7 must not open the wrong
        # definition (renumbered -> the sibling that defines it; unverifiable
        # -> plain text). Both default paths; the committed copies are the
        # fallback when this step is skipped.
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python pipeline/import_ccr.py dump-ids --out pipeline/out/corpus_ids.json

      - name: Parse PDF into provisions JSON
        run: |
          python pipeline/import_ccr.py parse \
            --reg "$REG" \
            --pdf "pipeline/sources/${SRC_BASENAME}.pdf" \
            --txt "pipeline/sources/${SRC_BASENAME}.txt" \
            --out "pipeline/out/reg${REG}_parsed.json"

      - name: Export current DB rows for this regulation
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python pipeline/import_ccr.py export \
            --reg "$REG" \
            --out "pipeline/out/reg${REG}_db.json"

      - name: Diff parsed output against the DB export
        run: |
          python pipeline/import_ccr.py diff \
            --reg "$REG" \
            --parsed "pipeline/out/reg${REG}_parsed.json" \
            --db "pipeline/out/reg${REG}_db.json" \
            --out "pipeline/out/reg${REG}_diff_report.md"

      - name: Build apply plan (and execute it, if requested)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          ARGS=(apply --reg "$REG" \
            --parsed "pipeline/out/reg${REG}_parsed.json" \
            --db "pipeline/out/reg${REG}_db.json" \
            --out-dir "pipeline/out/apply_reg${REG}")
          if [ "${{ inputs.execute }}" = "true" ]; then
            ARGS+=(--execute --yes)
          fi
          echo "Running: python pipeline/import_ccr.py ${ARGS[*]}"
          python pipeline/import_ccr.py "${ARGS[@]}"

      - name: Print stats and diff report to the job log
        if: always()
        run: |
          echo "### apply_reg${REG}/stats.md"
          cat "pipeline/out/apply_reg${REG}/stats.md" || echo "(not found -- an earlier step must have failed)"
          echo
          echo "### reg${REG}_diff_report.md (first 60 lines)"
          head -n 60 "pipeline/out/reg${REG}_diff_report.md" || echo "(not found -- an earlier step must have failed)"

      - name: Summarize, review and embed the rows this import changed (the chained run)
        # Runs automatically after every execute (ReviewBuiltIn, owner
        # decision 5 Oct 2026): every row whose letters or digits changed,
        # plus its ancestors, is regenerated, reviewed and embedded here, in
        # this run, within the standing $10 per regulation budget
        # (pipeline/budget.py). Both inputs are `type: boolean`, so in the
        # `inputs` context they are real booleans (never compare them to the
        # string 'true' here).
        if: ${{ inputs.execute && !inputs.skip_summaries }}
        id: chain
        working-directory: pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CHAIN_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          ARGS=(--ids-file "out/apply_reg${REG}/summary_regen_ids.txt"
                --ancestor-ids-file "out/apply_reg${REG}/summary_regen_ancestor_ids.txt"
                --label "import-reg${REG}" --sample-dir "../docs/imports/$(date -u +%Y-%m-%d)")
          if [ -n "${{ inputs.approved_budget }}" ]; then ARGS+=(--approved-budget "${{ inputs.approved_budget }}"); fi
          echo "Running: python run_chain.py ${ARGS[*]}"
          python run_chain.py "${ARGS[@]}"
          if [ -f out/chain_report.md ]; then
            head -c 60000 out/chain_report.md >> "$GITHUB_STEP_SUMMARY"
            echo "::group::chain_report.md"; cat out/chain_report.md; echo "::endgroup::"
          fi

      - name: Embed every other changed row (heading-only rows, markup-only changes)
        # The chained run embeds the rows it wrote. Rows whose text changed
        # but that carry no summary (headings-only) are embedded here; the
        # content hash means unchanged rows cost nothing.
        if: ${{ inputs.execute }}
        working-directory: pipeline
        env:
          VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python embed.py --reg "$REG"

      - name: Refresh the stored changelog counts
        # /changelog reads a stored snapshot, not a live aggregate (7 Oct
        # 2026). The execute path refreshes it itself; this is the backstop
        # after the chained run and the embed step, and after a dry run it
        # only recomputes what is already there.
        if: ${{ always() && inputs.execute }}
        working-directory: pipeline
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python refresh_changelog.py

      - name: Open a pull request with the spot-check sample
        if: ${{ inputs.execute && !inputs.skip_summaries && steps.chain.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git add docs/imports
          if git diff --cached --quiet; then echo "No sample document to commit."; exit 0; fi
          BRANCH="chain-sample/import-reg${REG}-${{ github.run_id }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git commit -m "Import reg ${REG}: 40-row spot-check sample from the chained run (run ${{ github.run_id }})"
          git push -u origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" \
            --title "Import reg ${REG}: spot-check sample (run ${{ github.run_id }})" \
            --body "The 40-row spot-check sample from the chained run that followed the import of reg ${REG}: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}." \
            || echo "::warning::Could not open the pull request. The sample is in the import artifact and on branch $BRANCH."

      - name: Upload import report (no SQL batch files)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: import-reg${{ inputs.reg }}
          path: |
            pipeline/out/**
            !pipeline/out/**/*.sql
          retention-days: 30
          if-no-files-found: warn
