name: Fetch eCFR print (PDF + pdftotext)

# Downloads the eCFR "enhanced display" print of one 40 CFR subpart -- the
# same PDF a person saves from the eCFR's Print/PDF menu, which is what
# pipeline/import_ecfr.py parses for OOOOa/b/c, JJJJ, IIII and ZZZZ -- runs
# `pdftotext -layout` on it, checks the running header, and commits
# pipeline/sources/<BASENAME>.pdf and .txt to the branch the workflow ran on.
#
# Why a workflow: www.ecfr.gov is not reachable from a Claude Code cloud
# session (the egress proxy refuses the host), so the "commit the official
# PDF to pipeline/sources/ first" step of the new-regulation checklist cannot
# be done from there by hand. GitHub's runners reach it (the Source freshness
# watcher has fetched the versioner API from them since September 2026).
#
# The PDF URL: the page's own Print/PDF link when the HTML carries one,
# else the explicit `pdf_url` input, else a short list of known URL shapes.
# Every candidate is accepted only when the download is a real PDF whose
# first text line is the eCFR running header
# ("40 CFR Part 60 Subpart OOOO (up to date as of M/D/YYYY)").
#
# Also saves the versioner's amendment history for the subpart
# (versions.json) and the page HTML as the `ecfr-fetch-<basename>` artifact,
# so the as-of date and the source link can be recorded in
# pipeline/sources/manifest.json by hand.

on:
  workflow_dispatch:
    inputs:
      title:
        description: "CFR title number (e.g. 40)."
        required: true
        default: "40"
      part:
        description: "CFR part number (e.g. 60)."
        required: true
        default: "60"
      subpart:
        description: "Subpart code as printed (e.g. OOOO, OOOOa)."
        required: true
      basename:
        description: "Source file basename under pipeline/sources/ (e.g. OOOO -> OOOO.pdf and OOOO.txt). Must match the import workflow's mapping for the reg key."
        required: true
      pdf_url:
        description: "Optional: the exact PDF URL to download, tried before the discovered and known URL shapes."
        required: false
        default: ""
      commit:
        description: "Commit the PDF and TXT to this branch. Leave unchecked to only download and upload the artifact."
        type: boolean
        required: false
        default: true

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TITLE: ${{ inputs.title }}
      PART: ${{ inputs.part }}
      SUBPART: ${{ inputs.subpart }}
      BASENAME: ${{ inputs.basename }}
      PDF_URL: ${{ inputs.pdf_url }}
      UA: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36 EssentialRegsImporter/1.0 (+https://essentialregs.com)"
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Validate inputs
        run: |
          for v in TITLE PART; do
            if [[ ! "${!v}" =~ ^[0-9]+$ ]]; then echo "::error::$v must be numeric -- got: ${!v}"; exit 1; fi
          done
          if [[ ! "$SUBPART" =~ ^[A-Za-z]{1,5}$ ]]; then echo "::error::subpart must be letters (e.g. OOOO) -- got: $SUBPART"; exit 1; fi
          if [[ ! "$BASENAME" =~ ^[A-Za-z0-9_]+$ ]]; then echo "::error::basename must be alphanumeric -- got: $BASENAME"; exit 1; fi

      - name: Install poppler-utils (pdftotext)
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Fetch the subpart page and the versioner history
        run: |
          mkdir -p fetch
          PAGE_URL="https://www.ecfr.gov/current/title-${TITLE}/part-${PART}/subpart-${SUBPART}"
          echo "Page: $PAGE_URL"
          curl -sSL -A "$UA" -o fetch/page.html -w "page HTTP %{http_code}, final URL %{url_effective}\n" "$PAGE_URL"
          echo "$PAGE_URL" > fetch/page_url.txt
          # Every snippet of the page that mentions a PDF or print, for the log and the artifact.
          grep -o -i '[^"'"'"' <>]*\(pdf\|print\)[^"'"'"' <>]*' fetch/page.html | sort -u > fetch/pdf_mentions.txt || true
          echo "::group::PDF / print mentions in the page HTML"; cat fetch/pdf_mentions.txt; echo "::endgroup::"
          VERS_URL="https://www.ecfr.gov/api/versioner/v1/versions/title-${TITLE}.json?part=${PART}&subpart=${SUBPART}"
          curl -sSL -A "$UA" -o fetch/versions.json -w "versions HTTP %{http_code}\n" "$VERS_URL" || true
          if jq -e '.content_versions' fetch/versions.json >/dev/null 2>&1; then
            echo "Versioner: $(jq '.content_versions | length' fetch/versions.json) section versions; latest amendment date: $(jq -r '[.content_versions[].amendment_date] | max' fetch/versions.json); latest issue date: $(jq -r '[.content_versions[].issue_date] | max' fetch/versions.json)"
          else
            echo "::warning::versioner response was not the expected JSON (see the artifact)."
          fi

      - name: Download the enhanced-display PDF
        run: |
          set -o pipefail
          cands=()
          [ -n "$PDF_URL" ] && cands+=("$PDF_URL")
          # Links the page itself carries (absolute or site-relative) that look like a PDF.
          while read -r u; do
            [ -z "$u" ] && continue
            case "$u" in
              http*) cands+=("$u") ;;
              /*) cands+=("https://www.ecfr.gov$u") ;;
            esac
          done < <(grep -i 'pdf' fetch/pdf_mentions.txt | grep -v '^#' || true)
          # Known URL shapes of the eCFR renderer, tried last.
          cands+=(
            "https://www.ecfr.gov/api/renderer/v1/content/enhanced/current/title-${TITLE}.pdf?part=${PART}&subpart=${SUBPART}"
            "https://www.ecfr.gov/api/renderer/v1/content/pdf/current/title-${TITLE}?part=${PART}&subpart=${SUBPART}"
            "https://www.ecfr.gov/current/title-${TITLE}/part-${PART}/subpart-${SUBPART}.pdf"
            "https://www.ecfr.gov/current/title-${TITLE}/part-${PART}/subpart-${SUBPART}?print=pdf"
            "https://www.ecfr.gov/api/renderer/v1/content/enhanced/current/title-${TITLE}?part=${PART}&subpart=${SUBPART}&format=pdf"
          )
          found=""
          i=0
          for u in "${cands[@]}"; do
            i=$((i+1))
            echo "--- candidate $i: $u"
            if ! curl -sSL -A "$UA" --max-time 600 -o fetch/cand.bin -w "HTTP %{http_code}, %{size_download} bytes, %{content_type}\n" "$u"; then
              echo "download failed"; continue
            fi
            mime=$(file -b --mime-type fetch/cand.bin)
            echo "mime: $mime"
            if [ "$mime" != "application/pdf" ]; then continue; fi
            pdftotext -layout fetch/cand.bin fetch/cand.txt
            first=$(grep -m1 -v '^\s*$' fetch/cand.txt || true)
            echo "first text line: $first"
            if echo "$first" | grep -q "Part ${PART} Subpart ${SUBPART} (up to date as of"; then
              found="$u"; break
            else
              echo "not the enhanced-display print of Subpart ${SUBPART}; next"
            fi
          done
          if [ -z "$found" ]; then
            echo "::error::No candidate URL returned the enhanced-display PDF of Subpart ${SUBPART}. Read pdf_mentions.txt in the artifact for the page's own link and re-run with pdf_url."
            exit 1
          fi
          echo "$found" > fetch/pdf_source_url.txt
          cp fetch/cand.bin "pipeline/sources/${BASENAME}.pdf"
          cp fetch/cand.txt "pipeline/sources/${BASENAME}.txt"
          echo "PDF source URL: $found"
          echo "Pages: $(grep -c $'\f' "pipeline/sources/${BASENAME}.txt" || true) form feeds; $(wc -c < "pipeline/sources/${BASENAME}.pdf") bytes PDF; $(wc -l < "pipeline/sources/${BASENAME}.txt") text lines"
          echo "::group::First 40 lines of the text"; head -n 40 "pipeline/sources/${BASENAME}.txt"; echo "::endgroup::"
          sha256sum "pipeline/sources/${BASENAME}.pdf" "pipeline/sources/${BASENAME}.txt" | tee fetch/sha256.txt

      - name: Commit the PDF and TXT to this branch
        if: ${{ inputs.commit }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "pipeline/sources/${BASENAME}.pdf" "pipeline/sources/${BASENAME}.txt"
          if git diff --cached --quiet; then echo "Nothing new to commit (files identical)."; exit 0; fi
          FIRST=$(grep -m1 -v '^\s*$' "pipeline/sources/${BASENAME}.txt")
          git commit -m "Sources: eCFR print of ${TITLE} CFR Part ${PART} Subpart ${SUBPART} (${BASENAME}.pdf/.txt)" \
                     -m "Downloaded by the Fetch eCFR print workflow (run ${{ github.run_id }}) from $(cat fetch/pdf_source_url.txt). Header: ${FIRST}"
          git push origin "HEAD:${{ github.ref_name }}"

      - name: Upload the fetch record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ecfr-fetch-${{ inputs.basename }}
          path: |
            fetch/page_url.txt
            fetch/pdf_mentions.txt
            fetch/pdf_source_url.txt
            fetch/versions.json
            fetch/sha256.txt
            fetch/page.html
          retention-days: 30
          if-no-files-found: warn
