name: CI

# Runs on every pull request and every push to main. No secrets: nothing
# here talks to Supabase, Stripe or Voyage. `next build` is left to Vercel,
# which builds every PR with the project's environment (it prerenders from
# the database, so it cannot run without the service-role key).

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    name: Web (lint, typecheck, unit tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        # next typegen writes the PageProps/LayoutProps globals the pages use.
        run: npm run typecheck

      - name: Unit tests
        # scripts/*.test.ts: reader helpers, reader gate, mobile nav,
        # marketing index. Fixture-backed cases skip (fixtures are git-ignored).
        run: npm test

  pipeline:
    name: Pipeline (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt pytest==9.1.1

      - name: Unit tests
        # No network, no database: every test runs on in-memory rows or
        # committed fixtures.
        run: python -m pytest -q
