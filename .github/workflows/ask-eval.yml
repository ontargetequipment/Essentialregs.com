name: Ask eval

# Scores Ask the way /admin/semantic-eval does (same questions, acronym
# expansion, question-map routing, RPC and pass rules) without a browser
# session: scripts/ask-eval.ts. Since Ask Track B (1 Oct 2026) it is the
# regression gate for every pull request to main (make the "Ask eval" check
# required in the branch protection), and it still runs by hand with extra
# questions to print the top N for.
#
# Every eval question also prints its ranking margin (src/lib/ask-margin.ts):
# how far its expected rows' fused score could fall before it fails; under
# 0.005 is flagged. The `margins` and `stability` inputs run
# scripts/ask-eval-stability.ts instead (the margin report alone; one
# question repeated with fresh and fixed query vectors).
#
# Cost and footprint: 38 + 6 Voyage query embeddings per run (a fraction of a
# cent) and reads of the production database with the service role; the only
# writes are the search_queries rows with mode='eval', exactly what a load of
# the eval page writes. A Postgres statement timeout is retried by the script.
# The script exits non-zero when a question outside KNOWN_FAILURES
# (src/lib/semantic-eval.ts) fails; the score is printed either way.
#
# Secrets: VOYAGE_API_KEY, SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY -- the same
# three the embed workflow uses. A pull request from a fork has no secrets and
# would fail at "VOYAGE_API_KEY is not set"; the repository takes no fork PRs.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      ask:
        description: "Extra questions to print the top N for, separated by ' | '."
        required: false
        default: ""
      ask_count:
        description: "How many hits to print per Ask question (1-50)."
        required: false
        default: "10"
      stability:
        description: "Instead of the eval: repeat this one question N times and report whether its ranking is stable (scripts/ask-eval-stability.ts)."
        required: false
        default: ""
      stability_runs:
        description: "How many repeats for the stability check (2-30)."
        required: false
        default: "10"
      stability_vector:
        description: "With `stability`: also print run 1's query vector (JSON), for replaying the ranking in SQL."
        type: boolean
        default: false
      margins:
        description: "Instead of the eval: the margin report, every eval question once with its ranking margin (scripts/ask-eval-stability.ts --margins)."
        type: boolean
        default: false

concurrency:
  group: ask-eval-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ask_eval:
    name: Ask eval
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run the eval
        env:
          VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ASK: ${{ inputs.ask }}
          ASK_COUNT: ${{ inputs.ask_count }}
          STABILITY: ${{ inputs.stability }}
          STABILITY_RUNS: ${{ inputs.stability_runs }}
          STABILITY_VECTOR: ${{ inputs.stability_vector }}
          MARGINS: ${{ inputs.margins }}
        run: |
          if [ "$MARGINS" = "true" ]; then
            npx tsx scripts/ask-eval-stability.ts --margins
            exit 0
          fi
          if [ -n "$STABILITY" ]; then
            EXTRA=()
            if [ "$STABILITY_VECTOR" = "true" ]; then EXTRA+=(--vector); fi
            npx tsx scripts/ask-eval-stability.ts --ask "$STABILITY" --runs "${STABILITY_RUNS:-10}" "${EXTRA[@]}"
            exit 0
          fi
          ARGS=()
          if [ -n "$ASK_COUNT" ]; then ARGS+=(--count "$ASK_COUNT"); fi
          if [ -n "$ASK" ]; then
            IFS='|' read -ra QS <<< "$ASK"
            for q in "${QS[@]}"; do
              q="$(echo "$q" | sed 's/^ *//;s/ *$//')"
              [ -n "$q" ] && ARGS+=(--ask "$q")
            done
          fi
          npx tsx scripts/ask-eval.ts "${ARGS[@]}"
