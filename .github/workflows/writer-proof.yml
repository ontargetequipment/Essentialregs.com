name: Writer proof (old vs new instructions, read-only)

# ReviewBuiltIn item 3: regenerate provisions the reviewer corrected in
# October 2026 with the OLD and the NEW writer instructions, without writing
# to the database, and run the reviewer in audit mode on both sets
# (pipeline/writer_proof.py). Reports the would-correct rate for each.
# Nothing in the database changes. Owner-approved spend for the proof: $3.

on:
  workflow_dispatch:
    inputs:
      groups:
        description: "group:count per group (gp = every general permit)."
        required: false
        default: "gp:30,3:30,7:30,oooob:30,ecmc:30"
      seed:
        description: "Sample seed."
        required: false
        default: "20261006"
      max_cost:
        description: "Refuse to submit above this estimate (USD)."
        required: false
        default: "3"
      arms:
        description: "Writers to run: old,new or one of them."
        required: false
        default: "old,new"
      execute:
        description: "Execute (paid calls; still read-only for the database). Unchecked = cost quote only."
        type: boolean
        required: false
        default: false

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt pytest==9.1.1
      - name: Unit tests
        run: python -m pytest test_summarize.py test_review.py -q
      - name: Run the proof
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          ARGS=(--groups "${{ inputs.groups }}" --seed "${{ inputs.seed }}" --max-cost "${{ inputs.max_cost }}" --arms "${{ inputs.arms }}")
          if [ "${{ inputs.execute }}" = "true" ]; then ARGS+=(--execute); else ARGS+=(--dry-run); fi
          echo "Running: python writer_proof.py ${ARGS[*]}"
          python writer_proof.py "${ARGS[@]}"
      - name: Report
        if: always()
        run: |
          if [ -f out/writer_proof.md ]; then
            head -c 60000 out/writer_proof.md >> "$GITHUB_STEP_SUMMARY"
            echo "::group::writer_proof.md"; cat out/writer_proof.md; echo "::endgroup::"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: writer-proof
          path: |
            pipeline/out/writer_proof.md
            pipeline/out/writer_proof.json
          retention-days: 90
          if-no-files-found: warn
